# Deep sleep after inactivity to save battery
CONFIG_ZMK_SLEEP=y

# RGB underglow is left disabled: on a nice!nano retrofit the WS2812 header
# runs off the 3.3V VCC rail (vs. 5V on the original Pro Micro), and the
# stock SPI driver overlay for underglow isn't wired up for nice_nano_v2 in
# the upstream shield. Revisit only if you add your own overlay for it.
# CONFIG_ZMK_RGB_UNDERGLOW=y
