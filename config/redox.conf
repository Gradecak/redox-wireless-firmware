# Deep sleep after inactivity to save battery
CONFIG_ZMK_SLEEP=y

# RGB underglow is left disabled by default: the shield's SPI-driven WS2812
# overlay is wired up for this board, but the strip runs off the 3.3V VCC
# rail (vs. 5V on the original Pro Micro) so it'll be dimmer/less reliable
# than before, and it costs battery life. Uncomment to try it.
# CONFIG_ZMK_RGB_UNDERGLOW=y
